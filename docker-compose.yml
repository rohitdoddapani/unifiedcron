services:
  db:
    image: postgres:16-alpine
    container_name: unifiedcron-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unifiedcron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unifiedcron}
      POSTGRES_DB: ${POSTGRES_DB:-unifiedcron}
    volumes:
      - ./db-data:/var/lib/postgresql/data
      - ./packages/database/src/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unifiedcron}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: unifiedcron-api
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-unifiedcron}:${POSTGRES_PASSWORD:-unifiedcron}@unifiedcron-db:5432/${POSTGRES_DB:-unifiedcron}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_PORT=3001
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: unifiedcron-web
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-unifiedcron}:${POSTGRES_PASSWORD:-unifiedcron}@unifiedcron-db:5432/${POSTGRES_DB:-unifiedcron}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      - INTERNAL_API_URL=http://unifiedcron-api:3001
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://dashboard.unifiedcron.com}
      - AUTH_TRUST_HOST=true
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://dashboard.unifiedcron.com}
    container_name: unifiedcron-landing
    environment:
      - NODE_ENV=production
    ports:
      - "3002:3002"
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  unifiedcron_postgres_data:
    driver: local

networks:
  proxy:
    external: true
