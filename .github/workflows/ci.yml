name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-jwt-secret
      NEXTAUTH_SECRET: ci-nextauth-secret
      ENCRYPTION_KEY: ci-encryption-key
      DATABASE_URL: postgres://ci:ci@localhost:5432/unifiedcron_ci_test
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/unifiedcron_ci_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: unifiedcron_ci_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace service dependencies
        run: pnpm build:services

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:unit

      - name: Database integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: quality
    env:
      POSTGRES_PORT: 5434
      JWT_SECRET: ci-jwt-secret
      NEXTAUTH_SECRET: ci-nextauth-secret
      ENCRYPTION_KEY: ci-encryption-key
      KEEP_STACK_RUNNING: "false"
      SMOKE_BUILD: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Docker info
        run: docker compose version

      - name: Compose smoke test
        run: pnpm smoke:compose
